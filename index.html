  <body>
    <!--
      Lamp backdrop — self-hosted 1080p video with the lavender/orange
      grade baked in. No iframe, no Safari autoplay quirks. Watchdog at
      the bottom of the page keeps it playing through pauses/stalls.
    -->
    <div class="lamp-stage">
      <video
        id="lamp-bg"
        class="lamp-bg"
        src="/lamp-bg.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        aria-hidden="true"
        disablepictureinpicture
        disableremoteplayback
        x-webkit-airplay="deny"
      ></video>
    </div>

    <div class="tungsten-glow" aria-hidden="true"></div>

    <div class="forum">
      <header class="forum__header">
        <p class="forum__wordmark"><a href="/">anselman<span class="tld">.com</span></a></p>
        <nav class="forum__nav">
          <a href="/">home</a><span class="sep">·</span><a href="/feed">feed</a><span class="sep">·</span><a href="/resume.pdf" target="_blank">resume</a><span class="sep">·</span><a href="https://github.com/blessdog" target="_blank" rel="noopener">github</a>
        </nav>
      </header>

      <main id="root"></main>

      <footer class="forum__footer">
        <p>made in lava with lamp · © 2026 anselman</p>
      </footer>
    </div>

    <script>
      (() => {
        // Watchdog: any time the lamp video pauses, stalls, or the tab
        // refocuses, try to play it again. Also try on the first user
        // interaction so browsers that hard-blocked autoplay (Safari Low
        // Power, per-site "Never Auto-Play") still hand us a play() the
        // moment the user touches the page.
        const video = document.getElementById('lamp-bg');
        if (video) {
          const tryPlay = () => video.play().catch(() => {});
          tryPlay();
          ['click', 'touchstart', 'scroll', 'keydown', 'pointerdown'].forEach((evt) => {
            document.addEventListener(evt, tryPlay, { passive: true });
          });
          video.addEventListener('pause', tryPlay);
          video.addEventListener('stalled', tryPlay);
          video.addEventListener('waiting', tryPlay);
          document.addEventListener('visibilitychange', () => {
            if (!document.hidden) tryPlay();
          });
        }
      })();
    </script>
  </body>
